<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcos TV Online - Sua TV no Navegador</title>
    
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        :root {
            --bg-primary: #0a0a1a;
            --bg-secondary: #12122a;
            --accent: #e50914;
            --accent-hover: #ff0f1f;
            --text: #ffffff;
            --text-secondary: #b3b3cc;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
            --gradient: linear-gradient(135deg, #e50914 0%, #7a0c2e 100%);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Partículas de fundo */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            background: rgba(229, 9, 20, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            color: var(--text);
            transition: var(--transition);
        }
        .logo:hover { transform: scale(1.02); }
        .logo-icon {
            width: 50px;
            height: 50px;
            background: var(--gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(229,9,20,0.6); }
            70% { box-shadow: 0 0 0 15px rgba(229,9,20,0); }
            100% { box-shadow: 0 0 0 0 rgba(229,9,20,0); }
        }
        .logo-text h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-text span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 1px;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
            min-width: 250px;
        }
        .search-bar input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--text);
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            transition: var(--transition);
            outline: none;
            backdrop-filter: blur(10px);
        }
        .search-bar input::placeholder { color: var(--text-secondary); }
        .search-bar input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.3);
            background: rgba(255,255,255,0.12);
        }
        .search-bar i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInUp 1s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-badge {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            margin-bottom: 25px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }
        .hero-badge i { color: var(--accent); margin-right: 8px; }
        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        .hero h1 .highlight {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero p {
            font-size: 1.2rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: var(--gradient);
            color: white;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(229, 9, 20, 0.6);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary i { transition: var(--transition); }
        .btn-primary:hover i { transform: translateX(5px); }
        .btn-primary::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .btn-primary:hover::after { left: 100%; }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 50vh;
            gap: 20px;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--glass);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: var(--text-secondary); font-size: 1.1rem; }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }
        .channel-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 20px;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.6s ease both;
            animation-delay: calc(var(--order) * 0.05s);
        }
        .channel-card:hover {
            background: var(--card-hover);
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
        }
        .channel-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gradient);
            transform: scaleX(0);
            transition: var(--transition);
        }
        .channel-card:hover::before { transform: scaleX(1); }
        .channel-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--glass);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 30px;
            color: var(--accent);
            border: 2px solid var(--glass-border);
            transition: var(--transition);
        }
        .channel-card:hover .channel-icon {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.4);
            transform: scale(1.1);
        }
        .channel-name {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 5px;
        }
        .channel-category {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .channel-play {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            transition: var(--transition);
            opacity: 0;
        }
        .channel-card:hover .channel-play {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            backdrop-filter: blur(20px);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            width: 90%;
            max-width: 900px;
            background: var(--bg-secondary);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: scaleIn 0.3s ease;
            position: relative;
        }
        @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
            background: var(--glass);
            border-bottom: 1px solid var(--glass-border);
        }
        .modal-header h3 { font-weight: 600; font-size: 1.2rem; }
        .btn-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            transition: var(--transition);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-close:hover { background: var(--glass); color: var(--text); transform: rotate(90deg); }
        .player-wrapper {
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }
        .player-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .plyr { --plyr-color-main: #e50914; height: 100%; width: 100%; }

        .error-message {
            text-align: center;
            padding: 40px;
            color: var(--accent);
            font-size: 1.2rem;
        }
        .error-message i { font-size: 3rem; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: stretch; }
            .search-bar { max-width: 100%; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
            .channel-icon { width: 50px; height: 50px; font-size: 22px; }
            .hero h1 { font-size: 2.2rem; }
            .btn-primary { padding: 15px 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <div class="app-container">
        <header class="header">
            <a href="#" class="logo" onclick="resetApp()">
                <div class="logo-icon"><i class="fas fa-tv"></i></div>
                <div class="logo-text">
                    <h1>Marcos TV</h1>
                    <span>ONLINE PREMIUM</span>
                </div>
            </a>
            <div class="search-bar" id="searchContainer" style="display: none;">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar canal...">
            </div>
        </header>

        <div id="appContent">
            <div class="hero" id="heroSection">
                <div class="hero-badge"><i class="fas fa-crown"></i> Premium IPTV</div>
                <h1>Bem-vindo à<br><span class="highlight">Marcos TV Online</span></h1>
                <p>Assista aos melhores canais de TV diretamente no seu navegador. Clique no botão abaixo para carregar a lista completa de canais premium.</p>
                <button class="btn-primary" onclick="loadChannels()">
                    <i class="fas fa-play-circle"></i> Carregar Canais
                </button>
            </div>
        </div>
    </div>

    <div id="playerModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="playerTitle">Reproduzindo Canal</h3>
                <button class="btn-close" onclick="closePlayer()"><i class="fas fa-times"></i></button>
            </div>
            <div class="player-wrapper">
                <video id="videoPlayer" controls playsinline></video>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <script>
        let allChannels = [];
        let filteredChannels = [];
        let player = null;
        let hls = null;
        let currentChannel = null;

        document.addEventListener('DOMContentLoaded', function() {
            const video = document.getElementById('videoPlayer');
            player = new Plyr(video, {
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 
                    'mute', 'volume', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['quality', 'speed'],
                quality: { default: 0, options: [1080, 720, 480, 360] },
                speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
                i18n: {
                    play: 'Reproduzir', pause: 'Pausar', mute: 'Silenciar',
                    unmute: 'Ativar som', settings: 'Configurações',
                    fullscreen: 'Tela cheia', exitFullscreen: 'Sair da tela cheia',
                    speed: 'Velocidade', normal: 'Normal', quality: 'Qualidade',
                    pip: 'Picture-in-Picture'
                }
            });
            createParticles();
        });

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 5 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 10 + 10 + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        function resetApp() {
            if (player) player.stop();
            if (hls) { hls.destroy(); hls = null; }
            closePlayer();
            document.getElementById('appContent').innerHTML = `
                <div class="hero" id="heroSection">
                    <div class="hero-badge"><i class="fas fa-crown"></i> Premium IPTV</div>
                    <h1>Bem-vindo à<br><span class="highlight">Marcos TV Online</span></h1>
                    <p>Assista aos melhores canais de TV diretamente no seu navegador. Clique no botão abaixo para carregar a lista completa de canais premium.</p>
                    <button class="btn-primary" onclick="loadChannels()">
                        <i class="fas fa-play-circle"></i> Carregar Canais
                    </button>
                </div>
            `;
            document.getElementById('searchContainer').style.display = 'none';
            document.getElementById('searchInput').value = '';
        }

        async function loadChannels() {
            const appContent = document.getElementById('appContent');
            appContent.innerHTML = `
                <div class="loading-container">
                    <div class="spinner"></div>
                    <div class="loading-text">Carregando lista de canais...</div>
                </div>
            `;

            try {
                const response = await fetch('https://raw.githubusercontent.com/marcosfla961-coder/IPTV/main/lista_premium.m3u');
                if (!response.ok) throw new Error('Falha ao carregar a lista');
                const data = await response.text();
                allChannels = parseM3U(data);
                filteredChannels = [...allChannels];
                if (allChannels.length === 0) throw new Error('Nenhum canal encontrado na lista');
                displayChannels(filteredChannels);
                document.getElementById('searchContainer').style.display = 'block';
                document.getElementById('searchInput').addEventListener('input', filterChannels);
            } catch (error) {
                appContent.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Erro ao carregar canais: ${error.message}</p>
                        <button class="btn-primary" onclick="loadChannels()" style="margin-top: 20px;">
                            <i class="fas fa-redo"></i> Tentar Novamente
                        </button>
                    </div>
                `;
            }
        }

        function parseM3U(data) {
            const lines = data.split('\n');
            const channels = [];
            let currentChannel = null;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (line.startsWith('#EXTINF')) {
                    const nameMatch = line.match(/,(.*?)$/);
                    let name = nameMatch ? nameMatch[1].trim() : 'Canal ' + (channels.length + 1);
                    const attrs = {};
                    const attrRegex = /([a-zA-Z0-9-]+)="([^"]*)"/g;
                    let match;
                    while ((match = attrRegex.exec(line)) !== null) {
                        attrs[match[1]] = match[2];
                    }
                    currentChannel = {
                        name: name,
                        group: attrs['group-title'] || 'Geral',
                        logo: attrs['tvg-logo'] || null,
                        id: attrs['tvg-id'] || null,
                        url: null
                    };
                } else if (line && !line.startsWith('#') && currentChannel) {
                    currentChannel.url = line;
                    channels.push(currentChannel);
                    currentChannel = null;
                }
            }
            return channels;
        }

        function displayChannels(channels) {
            const appContent = document.getElementById('appContent');
            if (channels.length === 0) {
                appContent.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-search"></i>
                        <p>Nenhum canal encontrado com esse nome.</p>
                    </div>
                `;
                return;
            }
            let gridHTML = '<div class="channels-grid">';
            channels.forEach((channel, index) => {
                const groupLabel = channel.group || 'Geral';
                gridHTML += `
                    <div class="channel-card" style="--order: ${index % 20}" onclick="playChannel(${allChannels.indexOf(channel)})">
                        <div class="channel-icon"><i class="fas fa-tv"></i></div>
                        <div class="channel-name">${escapeHtml(channel.name)}</div>
                        <div class="channel-category">${escapeHtml(groupLabel)}</div>
                        <div class="channel-play"><i class="fas fa-play"></i></div>
                    </div>
                `;
            });
            gridHTML += '</div>';
            appContent.innerHTML = `
                <div style="text-align: center; margin-bottom: 20px; color: var(--text-secondary); font-size: 0.9rem;">
                    <i class="fas fa-list"></i> Exibindo ${channels.length} de ${allChannels.length} canais
                </div>
                ${gridHTML}
            `;
        }

        function filterChannels() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredChannels = searchTerm 
                ? allChannels.filter(channel => 
                    channel.name.toLowerCase().includes(searchTerm) ||
                    (channel.group && channel.group.toLowerCase().includes(searchTerm)))
                : [...allChannels];
            displayChannels(filteredChannels);
        }

        function playChannel(channelIndex) {
            const channel = allChannels[channelIndex];
            if (!channel || !channel.url) {
                alert('URL do canal não encontrada');
                return;
            }
            currentChannel = channel;
            document.getElementById('playerTitle').textContent = channel.name;
            document.getElementById('playerModal').style.display = 'flex';

            const video = document.getElementById('videoPlayer');

            // Limpar reprodução anterior
            if (player) player.stop();
            if (hls) { hls.destroy(); hls = null; }

            // Função de fallback: tentar como source direto
            const tryDirectPlay = () => {
                console.log('Tentando reprodução direta...');
                video.src = channel.url;
                video.play().catch(e => {
                    alert('Não foi possível reproduzir este canal. Erro: ' + e.message);
                    closePlayer();
                });
            };

            // Tentar HLS primeiro (funciona para a maioria dos streams, mesmo sem extensão)
            if (Hls.isSupported()) {
                console.log('Tentando HLS.js para:', channel.url);
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600,
                    maxBufferSize: 60 * 1000 * 1000,
                    maxBufferHole: 0.5,
                    fragLoadingTimeOut: 20000,
                    manifestLoadingTimeOut: 10000,
                    levelLoadingTimeOut: 10000
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('Manifesto HLS carregado, iniciando reprodução...');
                    if (player) player.play();
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn('Erro fatal HLS:', data);
                        hls.destroy();
                        hls = null;
                        // Tentar fallback direto
                        tryDirectPlay();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari nativo
                console.log('Usando HLS nativo do Safari');
                video.src = channel.url;
                video.addEventListener('loadedmetadata', () => {
                    if (player) player.play();
                });
            } else {
                // Último recurso: tentar direto
                tryDirectPlay();
            }
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
            if (player) player.stop();
            if (hls) { hls.destroy(); hls = null; }
            const video = document.getElementById('videoPlayer');
            video.removeAttribute('src');
            video.load();
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.getElementById('playerModal').addEventListener('click', function(e) {
            if (e.target === this) closePlayer();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closePlayer();
        });
    </script>
</body>
</html>
