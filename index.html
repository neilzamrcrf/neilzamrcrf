<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARCOTV ULTRA VIP</title>
    <style>
        :root {
            --primary: #00ff00;
            --primary-glow: rgba(0, 255, 0, 0.6);
            --bg-dark: #050505;
            --card-bg: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff;
            --text-dim: #b0b0b0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body { 
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% -20%, #004400 0%, transparent 50%),
                linear-gradient(to bottom, #050505, #000);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: env(safe-area-inset-top) 15px 60px 15px;
            min-height: 100vh;
        }

        .header { text-align: center; padding: 40px 0 25px 0; }
        .header h1 { 
            font-size: 38px; font-weight: 900; margin: 0; text-transform: uppercase; 
            letter-spacing: 10px; background: linear-gradient(to bottom, #fff 20%, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }
        .header p { font-size: 10px; color: var(--primary); letter-spacing: 5px; margin-top: 8px; font-weight: bold; text-transform: uppercase; opacity: 0.9; }

        .search-box { position: sticky; top: 15px; z-index: 999; margin-bottom: 35px; }
        #search {
            width: 100%; padding: 18px 25px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 15, 15, 0.9); color: #fff; font-size: 16px; backdrop-filter: blur(15px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.8); transition: 0.3s;
        }
        #search:focus { border-color: var(--primary); box-shadow: 0 0 25px rgba(0, 255, 0, 0.3); }

        .cat-section { margin-bottom: 45px; animation: fadeInUp 0.8s ease-out forwards; }
        .cat-title { 
            font-size: 14px; color: var(--primary); font-weight: 900; margin: 0 0 20px 10px; 
            text-transform: uppercase; display: flex; align-items: center; letter-spacing: 3px;
        }
        .cat-title i { margin-right: 15px; font-style: normal; font-size: 22px; }
        .cat-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, var(--primary-glow), transparent); margin-left: 20px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 15px; }

        .card { 
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px; padding: 25px 10px; text-align: center; text-decoration: none; 
            color: var(--text-dim); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; align-items: center; position: relative;
        }
        .card:hover {
            background: rgba(0, 255, 0, 0.08); border-color: var(--primary); color: #fff;
            transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .icon-circle {
            width: 52px; height: 52px; background: rgba(255, 255, 255, 0.03);
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            margin-bottom: 15px; font-size: 26px; transition: 0.4s;
        }
        .card:hover .icon-circle { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); transform: rotate(-10deg); }

        .name { font-size: 9px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; width: 95%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .hidden { display: none; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>

    const icons = {
        "⚽ ESPORTES": "⚽",
        "🎬 FILMES E SÉRIES": "🍿",
        "📺 VARIEDADES E ABERTOS": "🎥",
        "🧒 KIDS": "🎈",
        "🌐 OUTROS": "🌐"
    };

    const container = document.getElementById('categorias-container');

    // --- FUNÇÃO PARA CRIAR CARDS ---
    function createCard(name, url, icon) {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = url;
        card.target = "_self";
        
        let formattedName = name.toUpperCase().replace(/[-_]/g, ' ');
        if(formattedName.includes('HBOMAX')) formattedName = formattedName.replace('HBOMAX', 'HBO MAX ');
        if(formattedName.includes('PRIMEVIDEO')) formattedName = formattedName.replace('PRIMEVIDEO', 'PRIME VIDEO ');
        if(formattedName.includes('DISNEYPLUS')) formattedName = formattedName.replace('DISNEYPLUS', 'DISNEY+ ');
        if(formattedName.includes('PARAMOUNTPLUS')) formattedName = formattedName.replace('PARAMOUNTPLUS', 'PARAMOUNT+ ');

        card.innerHTML = `<div class="icon-circle">${icon}</div><span class="name">${formattedName}</span>`;
        return card;
    }

    // --- RENDERIZAÇÃO ---
    
    // 1. Renderizar Canais RedeCanais
    for (const [categoria, lista] of Object.entries(redecanaisData)) {
        const section = document.createElement('div');
        section.className = 'cat-section';
        section.id = categoria.replace(/\s/g, '');
        section.innerHTML = `<div class="cat-title"><i>${icons[categoria]}</i> ${categoria}</div><div class="grid"></div>`;
        container.appendChild(section);

        lista.forEach(canal => {
            const fullUrl = baseUrl + canal;
            section.querySelector('.grid').appendChild(createCard(canal, fullUrl, icons[categoria]));
        });
    }

    // 2. Renderizar Links Diretos (Misturando nas categorias ou criando 'Outros')
    const directLinks = rawLinks.trim().split('\n').map(l => l.trim()).filter(l => l !== '');
    
    const extraSection = document.createElement('div');
    extraSection.className = 'cat-section';
    extraSection.innerHTML = `<div class="cat-title"><i>${icons["🌐 OUTROS"]}</i> MAIS CANAIS VIP</div><div class="grid"></div>`;
    container.appendChild(extraSection);

    directLinks.forEach(url => {
        let name = "";
        try {
            const urlObj = new URL(url);
            name = urlObj.searchParams.has("stream") ? urlObj.searchParams.get("stream") : urlObj.pathname.split('/').pop();
        } catch(e) { name = "CANAL"; }

        // Tentar encaixar na categoria correta pelo nome
        let categoryIcon = "📺";
        let targetGrid = extraSection.querySelector('.grid');

        if (name.match(/espn|sportv|premiere|dazn|ufc|futebol|sports/i)) targetGrid = document.getElementById('⚽ESPORTES').querySelector('.grid');
        else if (name.match(/hbo|telecine|tc|megapix|warner|tnt|filme|max/i)) targetGrid = document.getElementById('🎬FILMESE SÉRIES').querySelector('.grid');
        else if (name.match(/globo|sbt|record|band|discovery|history/i)) targetGrid = document.getElementById('📺VARIEDADESE ABERTOS').querySelector('.grid');
        else if (name.match(/disney|nick|kids|gloob|cartoon/i)) targetGrid = document.getElementById('🧒KIDS').querySelector('.grid');

        targetGrid.appendChild(createCard(name, url, categoryIcon));
    });

    // --- BUSCA ---
    function filtrar() {
        const term = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.card').forEach(card => {
            const name = card.innerText.toLowerCase();
            card.classList.toggle('hidden', !name.includes(term));
        });
        document.querySelectorAll('.cat-section').forEach(sec => {
            const hasVisible = sec.querySelectorAll('.card:not(.hidden)').length > 0;
            sec.style.display = hasVisible ? 'block' : 'none';
        });
    }
